function createLeaves() {
  const container = document.getElementById('leavesContainer');
  if (!container) return;
  container.innerHTML = '';
  const leafSVGs = [
    `<svg viewBox="0 0 40 80" xmlns="http://www.w3.org/2000/svg"><path d="M20 0 C 10 20, 5 40, 20 80 C 35 40, 30 20, 20 0 Z" fill="#6ee7b7"/></svg>`,
    `<svg viewBox="0 0 40 80" xmlns="http://www.w3.org/2000/svg"><path d="M20 0 C 8 25, 5 50, 20 80 C 35 50, 32 25, 20 0 Z" fill="#a7f3d0"/></svg>`,
    `<svg viewBox="0 0 40 80" xmlns="http://www.w3.org/2000/svg"><path d="M20 0 C 12 20, 8 45, 20 80 C 32 45, 28 20, 20 0 Z" fill="#34d399"/></svg>`
  ];
  for (let i = 0; i < 7; i++) {
    const leaf = document.createElement('div');
    leaf.className = 'leaf';
    leaf.innerHTML = leafSVGs[i % leafSVGs.length];
    const size = 18 + Math.random() * 22;
    leaf.style.width = size + 'px';
    leaf.style.left = (Math.random() * 100) + '%';
    leaf.style.animationDuration = (15 + Math.random() * 20) + 's';
    leaf.style.animationDelay = (Math.random() * 15) + 's';
    container.appendChild(leaf);
  }
}

function createParticles() {
  const container = document.getElementById('particles');
  if (!container) return;
  container.innerHTML = '';
  for (let i = 0; i < 15; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    p.style.left = (Math.random() * 100) + '%';
    p.style.top = (Math.random() * 100) + '%';
    p.style.animationDelay = (Math.random() * 4) + 's';
    p.style.animationDuration = (3 + Math.random() * 3) + 's';
    container.appendChild(p);
  }
}

function selectUser(user) {
  closeModal('userSelectModal');
  pinState.currentUser = user;
  pinState.buffer = '';
  pinState.firstPin = null;
  pinState.step = '';
  
  const userSpaces = data.espaciosPrivados[user];
  if (!userSpaces.pin) {
    pinState.mode = 'create';
    pinState.step = 'first';
    const title = document.getElementById('pinTitle');
    const subtitle = document.getElementById('pinSubtitle');
    if (title) title.textContent = '🔐 Crea tu PIN (4 dígitos)';
    if (subtitle) subtitle.textContent = 'Introduce un PIN que solo tú recordarás';
  } else {
    pinState.mode = 'login';
    const name = user === 'A' ? 'Raul 🌱' : 'Marta 🐨';
    const title = document.getElementById('pinTitle');
    const subtitle = document.getElementById('pinSubtitle');
    if (title) title.textContent = '🔐 PIN de ' + name;
    if (subtitle) subtitle.textContent = 'Introduce tu PIN personal';
  }
  
  updatePinDisplay();
  const msg = document.getElementById('pinMessage');
  if (msg) { msg.textContent = ''; msg.className = 'pin-message'; }
  const modal = document.getElementById('pinModal');
  if (modal) modal.classList.add('active');
}

function updatePinDisplay() {
  const dots = document.querySelectorAll('#pinDisplay .pin-dot');
  dots.forEach((dot, i) => {
    dot.classList.toggle('filled', i < pinState.buffer.length);
  });
}

function pinInput(num) {
  const msg = document.getElementById('pinMessage');
  if (msg) { msg.textContent = ''; msg.className = 'pin-message'; }
  
  if (pinState.mode === 'create') {
    if (pinState.step === 'first') {
      pinState.buffer += num;
      updatePinDisplay();
      if (pinState.buffer.length === 4) {
        pinState.firstPin = pinState.buffer;
        setTimeout(() => {
          pinState.buffer = '';
          pinState.step = 'confirm';
          const subtitle = document.getElementById('pinSubtitle');
          if (subtitle) subtitle.textContent = 'Confirma tu PIN';
          updatePinDisplay();
        }, 300);
      }
    } else if (pinState.step === 'confirm') {
      pinState.buffer += num;
      updatePinDisplay();
      if (pinState.buffer.length === 4) {
        if (pinState.buffer === pinState.firstPin) {
          data.espaciosPrivados[pinState.currentUser].pin = simpleHash(pinState.buffer);
          debouncedSave();
          if (msg) { msg.textContent = '✓ PIN creado'; msg.style.color = '#6ee7b7'; }
          setTimeout(() => {
            closeModal('pinModal');
            enterPrivateSpace(pinState.currentUser);
          }, 600);
        } else {
          if (msg) { msg.textContent = 'Los PIN no coinciden'; msg.className = 'pin-message error'; }
          pinState.buffer = '';
          pinState.firstPin = null;
          pinState.step = 'first';
          const subtitle = document.getElementById('pinSubtitle');
          if (subtitle) subtitle.textContent = 'Introduce un PIN de 4 dígitos';
          updatePinDisplay();
        }
      }
    }
  } else if (pinState.mode === 'login') {
    if (pinState.buffer.length < 4) {
      pinState.buffer += num;
      updatePinDisplay();
      if (pinState.buffer.length === 4) {
        setTimeout(verifyPin, 200);
      }
    }
  } else if (pinState.mode === 'change') {
    if (pinState.step === 'verify') {
      pinState.buffer += num;
      updatePinDisplay();
      if (pinState.buffer.length === 4) {
        setTimeout(verifyCurrentPin, 200);
      }
    } else if (pinState.step === 'new') {
      pinState.buffer += num;
      updatePinDisplay();
      if (pinState.buffer.length === 4) {
        pinState.firstPin = pinState.buffer;
        setTimeout(() => {
          pinState.buffer = '';
          pinState.step = 'confirm-new';
          const subtitle = document.getElementById('pinSubtitle');
          if (subtitle) subtitle.textContent = 'Confirma tu nuevo PIN';
          updatePinDisplay();
        }, 300);
      }
    } else if (pinState.step === 'confirm-new') {
      pinState.buffer += num;
      updatePinDisplay();
      if (pinState.buffer.length === 4) {
        if (pinState.buffer === pinState.firstPin) {
          data.espaciosPrivados[pinState.currentUser].pin = simpleHash(pinState.buffer);
          debouncedSave();
          if (msg) { msg.textContent = '✓ PIN cambiado'; msg.style.color = '#6ee7b7'; }
          setTimeout(() => { closeModal('pinModal'); }, 600);
        } else {
          if (msg) { msg.textContent = 'Los PIN no coinciden'; msg.className = 'pin-message error'; }
          pinState.buffer = '';
          pinState.firstPin = null;
          pinState.step = 'new';
          const subtitle = document.getElementById('pinSubtitle');
          if (subtitle) subtitle.textContent = 'Introduce tu nuevo PIN';
          updatePinDisplay();
        }
      }
    }
  }
}

function verifyPin() {
  const inputHash = simpleHash(pinState.buffer);
  const storedHash = data.espaciosPrivados[pinState.currentUser].pin;
  const msg = document.getElementById('pinMessage');
  
  if (inputHash === storedHash) {
    if (msg) { msg.textContent = '✓ Acceso correcto'; msg.style.color = '#6ee7b7'; }
    setTimeout(() => {
      closeModal('pinModal');
      enterPrivateSpace(pinState.currentUser);
    }, 400);
  } else {
    if (msg) { msg.textContent = 'PIN incorrecto'; msg.className = 'pin-message error'; }
    pinState.buffer = '';
    updatePinDisplay();
  }
}

function verifyCurrentPin() {
  const inputHash = simpleHash(pinState.buffer);
  const storedHash = data.espaciosPrivados[pinState.currentUser].pin;
  const msg = document.getElementById('pinMessage');
  
  if (inputHash === storedHash) {
    pinState.buffer = '';
    pinState.step = 'new';
    const subtitle = document.getElementById('pinSubtitle');
    if (subtitle) subtitle.textContent = 'Introduce tu nuevo PIN';
    updatePinDisplay();
  } else {
    if (msg) { msg.textContent = 'PIN actual incorrecto'; msg.className = 'pin-message error'; }
    pinState.buffer = '';
    updatePinDisplay();
  }
}

function pinBackspace() {
  if (pinState.buffer.length > 0) {
    pinState.buffer = pinState.buffer.slice(0, -1);
    updatePinDisplay();
  }
}

function simpleHash(str) {
  let hash = 5381;
  for (let i = 0; i < str.length; i++) {
    hash = ((hash << 5) + hash) + str.charCodeAt(i);
  }
  return (hash >>> 0).toString(36);
}

function changePin() {

function currentMonthKey(){
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
}

function defaultMonthData(){
  return {
    aportaCuentaA: 700, aportaCuentaB: 500,
    alquiler: [],
    suscripciones: [],
    variablesAsociadas: [],
    ahorro: []
  };
}

function ensureDataStructure(){
  if(!data.meses || typeof data.meses !== 'object') data.meses = {};
  if(!Array.isArray(data.deudas)) data.deudas = [];
  if(!Array.isArray(data.pagos)) data.pagos = [];
  if(!data.espaciosPrivados) data.espaciosPrivados = { A: { pin: null, gastos: [] }, B: { pin: null, gastos: [] } };
  if(!data.espaciosPrivados.A) data.espaciosPrivados.A = { pin: null, gastos: [] };
  if(!data.espaciosPrivados.B) data.espaciosPrivados.B = { pin: null, gastos: [] };
  if(!Array.isArray(data.espaciosPrivados.A.gastos)) data.espaciosPrivados.A.gastos = [];
  if(!Array.isArray(data.espaciosPrivados.B.gastos)) data.espaciosPrivados.B.gastos = [];
  
  const keys = Object.keys(data.meses).sort();
  if(keys.length === 0){
    const cur = currentMonthKey();
    data.meses[cur] = defaultMonthData();
    data.mesActivo = cur;
  } else {
    if(!data.mesActivo || !data.meses[data.mesActivo]){
      data.mesActivo = keys[keys.length - 1];
    }
  }
}

function loadLocal(){
  const s = localStorage.getItem('hogarDataComunesMTM');
  if(s){ try{ data = JSON.parse(s); }catch(e){} }
  ensureDataStructure();
}

function save(){ localStorage.setItem('hogarDataComunesMTM', JSON.stringify(data)); }

function setSyncStatus(cls, text){
  const el = document.getElementById('syncStatus');
  if(!el) return;
  el.className = 'sync-badge ' + (cls === 'ok' ? 'ok' : 'syncing');
  el.textContent = '● ' + text;
}

// ==========================================
// FUNCIÓN DE GUARDADO CORREGIDA CON MANEJO DE ERRORES
// ==========================================
function saveToFirebase(){
  if(!db) {
    console.warn("Firebase no inicializado. Guardando solo en local.");
    setSyncStatus('ok', 'Guardado local');
    return;
  }
  setSyncStatus('syncing', 'Guardando...');
  
  db.collection('hogar').doc('dataFinanzasComunes').set(data)
    .then(() => {
      console.log("Sincronización con Firebase exitosa");
      setSyncStatus('ok', 'Sincronizado');
    })
    .catch((error) => {
      console.error("ERROR CRÍTICO DE FIREBASE:", error);
      setSyncStatus('error', 'Error de BD');
      // Fallback: después de 2 segundos, muestra que se guardó en local para que no se quede colgado
      setTimeout(() => {
        setSyncStatus('ok', 'Guardado local');
      }, 2500);
    });
}

function debouncedSave(){
  clearTimeout(saveTimeout);
  saveTimeout = setTimeout(() => {
    save();
    saveToFirebase();
  }, 400);
}

function initFirebase(){
  try{
    if(!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }
    db = firebase.firestore();
    
    if (!db) {
        console.error("Firestore no disponible");
        setSyncStatus('error', 'Sin BD');
        return;
    }

    setSyncStatus('syncing', 'Conectando...');
    if(unsubscribeFirestore) unsubscribeFirestore();
    
    unsubscribeFirestore = db.collection('hogar').doc('dataFinanzasComunes').onSnapshot((doc) => {
      if(doc.exists){
        const remote = doc.data();
        // Evitamos bucles infinitos comparando cadenas
        if(JSON.stringify(data) !== JSON.stringify(remote)){
          console.log("Datos actualizados desde Firebase");
          data = remote;
          ensureDataStructure();
          renderAll();
          if (privateSession.authenticated) renderPrivateSpace(true);
        }
        setSyncStatus('ok', 'Sincronizado');
      } else {
        console.log("Documento no existe, creando...");
        saveToFirebase();
        setSyncStatus('ok', 'Sincronizado');
      }
    }, (error) => {
        console.error("Error en la suscripción de Firestore:", error);
        setSyncStatus('error', 'Error de conexión');
    });
  }catch(e){ 
      console.error("Error al inicializar Firebase:", e);
      setSyncStatus('error', 'Error config'); 
  }
}

function getMonthLabel(key){
  const parts = key.split('-');
  if(parts.length !== 2) return key;
  return MONTH_NAMES[parseInt(parts[1]) - 1] + ' ' + parts[0];
}

function updateMonthLabel(){
  const el = document.getElementById('monthLabel');
  if (el) el.textContent = getMonthLabel(data.mesActivo);
}

function prevMonth(){
  const keys = Object.keys(data.meses).sort();
  const idx = keys.indexOf(data.mesActivo);
  if(idx > 0){
    data.mesActivo = keys[idx - 1];
    save(); saveToFirebase(); renderAll();
  }
}

function nextMonth(){
  const keys = Object.keys(data.meses).sort();
  const idx = keys.indexOf(data.mesActivo);
  if(idx < keys.length - 1){
    data.mesActivo = keys[idx + 1];
    save(); saveToFirebase(); renderAll();
  }
}

function goToCurrentMonth(){
  const cur = currentMonthKey();
  if(!data.meses[cur]) data.meses[cur] = defaultMonthData();
  data.mesActivo = cur;
  save(); saveToFirebase(); renderAll();
}

function createNewMonth(){
  const keys = Object.keys(data.meses).sort();
  const last = keys[keys.length - 1];
  const [y, m] = last.split('-').map(Number);
  const next = new Date(y, m, 1);
  const key = next.getFullYear() + '-' + String(next.getMonth() + 1).padStart(2, '0');
  
  if(data.meses[key]){
    data.mesActivo = key;
    save(); saveToFirebase(); renderAll();
    return;
  }
  
  const prevM = data.meses[last];
  let totCPrev = prevM.aportaCuentaA + prevM.aportaCuentaB;
  let gastCPrev = prevM.alquiler.reduce((s, r) => s + r.importe, 0) +
                  prevM.suscripciones.filter(r => r.tipo === 'comun' || !r.tipo).reduce((s, r) => s + r.importe, 0) +
                  prevM.variablesAsociadas.filter(r => r.tipo === 'comun' || !r.tipo).reduce((s, r) => s + r.importe, 0);
  let sobrantePrev = Math.max(0, totCPrev - gastCPrev);

  data.meses[key] = {
    aportaCuentaA: prevM.aportaCuentaA,
    aportaCuentaB: prevM.aportaCuentaB,
    alquiler: prevM.alquiler.filter(r => r.estable).map(r => ({...r})),
    suscripciones: prevM.suscripciones.filter(r => r.estable).map(r => ({...r})),
    variablesAsociadas: prevM.variablesAsociadas.filter(r => r.estable).map(r => ({...r})),
    ahorro: sobrantePrev > 0 ? [{fecha: key + '-01', concepto: 'Ahorro mes anterior', importe: sobrantePrev, persona: 'A', estable: false}] : []
  };
  
  ['A', 'B'].forEach(user => {
    const prevGastos = data.espaciosPrivados[user].gastos;
    const gastosEstables = prevGastos.filter(g => g.estable && g.fecha && g.fecha.startsWith(last));
    gastosEstables.forEach(g => {
      const newGasto = {...g, fecha: key + g.fecha.slice(7)};
      data.espaciosPrivados[user].gastos.push(newGasto);
    });
  });
  
  data.mesActivo = key;
  save(); saveToFirebase(); renderAll();
  if (privateSession.authenticated) renderPrivateSpace(true);
}

function deleteCurrentMonth(){
  if(Object.keys(data.meses).length <= 1){
    alert('No puedes borrar el único mes.');
    return;
  }
  if(confirm('¿Borrar definitivamente ' + getMonthLabel(data.mesActivo) + '?')){
    const mesBorrado = data.mesActivo;
    delete data.meses[mesBorrado];
    const keys = Object.keys(data.meses).sort();
    data.mesActivo = keys[keys.length - 1];
    save();
    if(db){
      setSyncStatus('syncing', 'Borrando...');
      db.collection('hogar').doc('dataFinanzasComunes').set(data)
        .then(() => { setSyncStatus('ok', 'Sincronizado'); renderAll(); })
        .catch(() => { setSyncStatus('error', 'Error'); });
    } else {
      renderAll();
    }
  }
}

function curMonth(){
  const keys = Object.keys(data.meses).sort();
  if(keys.length === 0){
    const cur = currentMonthKey();
    data.meses[cur] = defaultMonthData();
    data.mesActivo = cur;
  } else if(!data.mesActivo || !data.meses[data.mesActivo]){
    data.mesActivo = keys[keys.length - 1];
  }
  return data.meses[data.mesActivo];
}

function switchTab(e, id){
  if (e && e.currentTarget) {
    document.querySelectorAll('.nav-item').forEach(t => t.classList.remove('active'));
    e.currentTarget.classList.add('active');
  }
  document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
  
  const target = document.getElementById(id);
  if(target){
    target.classList.remove('active');
    void target.offsetWidth;
    target.classList.add('active');
  }
  
  if(id === 'resumen') recalcAll();
  if(id === 'comun') { renderAlquiler(); renderSuscripciones(); renderVariablesAsociadas(); }
  if(id === 'deudas') { renderDeudas(); renderPagos(); updateDebtDisplay(); }
  if(id === 'ahorro') renderAhorro();
  if(id === 'anual') renderAcumuladoAnual();
  if(id === 'privado') renderPrivateSpace(true);
}

function updateCuentaComun(){
  const m = curMonth();
  const a = document.getElementById('aportaCuentaA');
  const b = document.getElementById('aportaCuentaB');
  if (a) m.aportaCuentaA = +a.value || 0;
  if (b) m.aportaCuentaB = +b.value || 0;
  debouncedSave(); recalcAll();
}

function renderAll(){
  ensureDataStructure();
  updateMonthLabel();
  const m = curMonth();
  if(!m) return;
  const a = document.getElementById('aportaCuentaA');
  const b = document.getElementById('aportaCuentaB');
  if (a) a.value = m.aportaCuentaA;
  if (b) b.value = m.aportaCuentaB;
  renderAlquiler(); renderSuscripciones(); renderVariablesAsociadas();
  renderDeudas(); renderPagos(); renderAhorro();
  recalcAll();
}

function renderExpenseRow(r, i, category) {
  const icon = CATEGORY_ICONS[category] || '📦';
  let payerInfo = '';
  if (r.tipo === 'individual') {
    const payer = r.payer || 'A';
    let payerIcon, payerName;
    if (payer === 'both') {
      payerIcon = '👥';
      payerName = 'Ambos';
    } else {
      payerIcon = payer === 'A' ? '🌱' : '🐨';

function calcDeudaTotal(){
  let manA = 0, manB = 0;
  data.deudas.forEach(d => { if(d.deudor === 'A') manA += d.total; else manB += d.total; });
  let pagAM = 0, pagMA = 0;
  data.pagos.forEach(p => {
    if(p.deudor === 'A' && p.acreedor === 'B') pagAM += p.importe;
    if(p.deudor === 'B' && p.acreedor === 'A') pagMA += p.importe;
  });
  const neto = manB - manA - pagMA + pagAM;
  return {neto, abs: Math.abs(neto)};
}

function updateDebtDisplay(){
  const d = calcDeudaTotal();
  const display = document.getElementById('deudaTotalDisplay');
  const detalle = document.getElementById('deudaTotalDetalle');
  const acum = document.getElementById('deudaAcumulada');
  const detalle2 = document.getElementById('deudaDetalle');
  
  if (display) display.textContent = d.abs.toFixed(2) + ' €';
  if (detalle) {
    if(d.neto > 0.01) detalle.innerHTML = '🐨 Marta debe a 🌱 Raul: <b>' + d.abs.toFixed(2) + ' €</b>';
    else if(d.neto < -0.01) detalle.innerHTML = '🌱 Raul debe a 🐨 Marta: <b>' + d.abs.toFixed(2) + ' €</b>';
    else detalle.textContent = 'Cuentas equilibradas ✓';
  }
  if (acum) acum.textContent = d.abs.toFixed(2) + ' €';
  if (detalle2) {
    if(d.neto > 0.01) detalle2.innerHTML = '🐨 Marta debe a 🌱 Raul';
    else if(d.neto < -0.01) detalle2.innerHTML = '🌱 Raul debe a 🐨 Marta';
    else detalle2.textContent = 'Equilibrado ✓';
  }
}

function recalcAll(){
  const m = curMonth();
  if(!m) return;
  const totC = m.aportaCuentaA + m.aportaCuentaB;
  
  const gastAlq = m.alquiler.reduce((s, r) => s + r.importe, 0);
  const gastSubComun = m.suscripciones.filter(r => r.tipo === 'comun' || !r.tipo).reduce((s, r) => s + r.importe, 0);
  const gastVarComun = m.variablesAsociadas.filter(r => r.tipo === 'comun' || !r.tipo).reduce((s, r) => s + r.importe, 0);
  const gastC = gastAlq + gastSubComun + gastVarComun;

  const set = (id, val) => { const el = document.getElementById(id); if (el) el.textContent = val; };
  
  set('totalCuenta', totC.toFixed(0) + ' €');
  set('gastosComunes', gastC.toFixed(0) + ' €');
  set('restanteAhorro', (totC - gastC).toFixed(0) + ' €');
  set('ahorroSobranteBox', (totC - gastC).toFixed(0) + ' €');
  set('gastoComunTotal', gastC.toFixed(0) + ' €');

  const gR = m.suscripciones.filter(r => r.tipo === 'individual').reduce((s, r) => s + (r.aportaA || 0), 0) +
             m.variablesAsociadas.filter(r => r.tipo === 'individual').reduce((s, r) => s + (r.aportaA || 0), 0);

  const gM = m.suscripciones.filter(r => r.tipo === 'individual').reduce((s, r) => s + (r.aportaB || 0), 0) +
             m.variablesAsociadas.filter(r => r.tipo === 'individual').reduce((s, r) => s + (r.aportaB || 0), 0);

  const gTotPersonal = gR + gM;

  set('gastoPersonalTotal', gTotPersonal.toFixed(0) + ' €');
  set('gastoPersonalRaul', gR.toFixed(0) + ' €');
  set('gastoPersonalMarta', gM.toFixed(0) + ' €');

  updateDebtDisplay();
  renderChart(gR, gM);
}

function renderChart(gR, gM){
  const canvas = document.getElementById('chartPersonales');
  if(!canvas) return;
  if(chartInstance) chartInstance.destroy();
  chartInstance = new Chart(canvas, {
    type: 'doughnut',
    data: {
      labels: ['🌱 Raul', '🐨 Marta'],
      datasets: [{data: [gR, gM], backgroundColor: ['#10b981', '#ec4899'], borderWidth: 0}]
    },
    options: {responsive: true, maintainAspectRatio: false, plugins: {legend: {position: 'bottom', labels: {color: '#fff8f0', font: {size: 13}}}}, cutout: '65%'}
  });
}

function calcularAcumuladoAnual() {
  let acum = { vivienda: 0, variablesComun: 0, suscripcionesComun: 0, personalRaul: 0, personalMarta: 0, totalGastos: 0 };
  Object.values(data.meses).forEach(m => {
    m.alquiler.forEach(r => { acum.vivienda += r.importe; acum.totalGastos += r.importe; });
    m.suscripciones.forEach(r => {
      if (r.tipo === 'comun' || !r.tipo) { acum.suscripcionesComun += r.importe; } 
      else { 
        acum.personalRaul += (r.aportaA || 0);
        acum.personalMarta += (r.aportaB || 0);
      }
      acum.totalGastos += r.importe;
    });
    m.variablesAsociadas.forEach(r => {
      if (r.tipo === 'comun' || !r.tipo) { acum.variablesComun += r.importe; } 
      else {
        acum.personalRaul += (r.aportaA || 0);
        acum.personalMarta += (r.aportaB || 0);
      }
      acum.totalGastos += r.importe;
    });
  });
  return acum;
}

function renderAcumuladoAnual() {
  const acum = calcularAcumuladoAnual();
  const set = (id, val) => { const el = document.getElementById(id); if (el) el.textContent = val; };

  }).join('');
}

function openPrivateExpenseModal(index = -1) {
  document.getElementById('privateExpenseModalIndex').value = index;
  document.getElementById('privateExpenseModalTitle').textContent = index >= 0 ? '✏️ Editar gasto' : '➕ Añadir gasto';
  document.getElementById('privateExpenseModalDelete').style.display = index >= 0 ? 'block' : 'none';
  
  const today = new Date().toISOString().slice(0, 10);
  
  if (index >= 0) {
    const r = data.espaciosPrivados[privateSession.user].gastos[index];
    document.getElementById('privateExpenseModalDate').value = r.fecha || today;
    document.getElementById('privateExpenseModalAmount').value = r.importe || 0;
    document.getElementById('privateExpenseModalConcept').value = r.concepto || '';
    document.getElementById('privateExpenseModalCategory').value = r.categoria || 'otros';
    document.getElementById('privateExpenseModalFixed').checked = !!r.estable;
  } else {
    document.getElementById('privateExpenseModalDate').value = today;
    document.getElementById('privateExpenseModalAmount').value = '';
    document.getElementById('privateExpenseModalConcept').value = '';
    document.getElementById('privateExpenseModalCategory').value = 'otros';
    document.getElementById('privateExpenseModalFixed').checked = false;
  }
  
  const modal = document.getElementById('privateExpenseModal');
  if (modal) modal.classList.add('active');
}

function savePrivateExpenseFromModal() {
  const index = parseInt(document.getElementById('privateExpenseModalIndex').value);
  const date = document.getElementById('privateExpenseModalDate').value;
  const amount = parseFloat(document.getElementById('privateExpenseModalAmount').value) || 0;
  const concept = document.getElementById('privateExpenseModalConcept').value.trim();
  const category = document.getElementById('privateExpenseModalCategory').value;
  const fixed = document.getElementById('privateExpenseModalFixed').checked;
  
  if (!concept) { alert('Introduce un concepto'); return; }
  
  const record = { fecha: date, concepto: concept, importe: amount, categoria: category, estable: fixed };
  const user = privateSession.user;
  
  if (index >= 0) data.espaciosPrivados[user].gastos[index] = record;
  else data.espaciosPrivados[user].gastos.push(record);
  
  debouncedSave();
  closeModal('privateExpenseModal');
  renderPrivateSpace(true);
}

function deletePrivateExpenseFromModal() {
  const index = parseInt(document.getElementById('privateExpenseModalIndex').value);
  const user = privateSession.user;
  if (index >= 0 && confirm('¿Eliminar este gasto?')) {
    data.espaciosPrivados[user].gastos.splice(index, 1);
    debouncedSave();
    closeModal('privateExpenseModal');
    renderPrivateSpace(true);
  }
}

function renderPrivateChart() {
  if (!privateSession.authenticated) return;
  const user = privateSession.user;
  const gastos = data.espaciosPrivados[user].gastos;
  
  const categorias = {};
  gastos.forEach(g => {
    const cat = g.categoria || 'otros';
    categorias[cat] = (categorias[cat] || 0) + (+g.importe || 0);
  });
  
  const labels = Object.keys(categorias);
  const values = Object.values(categorias);
  const colors = ['#f59e0b', '#10b981', '#3b82f6', '#ec4899', '#8b5cf6', '#ef4444', '#6366f1'];
  
  const canvas = document.getElementById('chartPrivado');
  if (!canvas) return;
  if (chartInstancePrivado) chartInstancePrivado.destroy();
  
  if (labels.length === 0) {
    const ctx = canvas.getContext('2d');
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    return;
  }
  
  chartInstancePrivado = new Chart(canvas, {
    type: 'doughnut',
    data: {
      labels: labels.map(l => (categorias[l] > 0 ? (CATEGORY_ICONS[l] || '') + ' ' : '') + l.charAt(0).toUpperCase() + l.slice(1)),
      datasets: [{data: values, backgroundColor: colors.slice(0, labels.length), borderWidth: 0}]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: {
        legend: { position: 'bottom', labels: { color: '#fff8f0', font: {size: 11}, padding: 10 } }
      },
      cutout: '60%'
    }
  });
}

// Inicialización de sesión privada al cargar
if (privateSession.authenticated) {
  const user = privateSession.user;
  const name = user === 'A' ? '🌱 Raul' : '🐨 Marta';
  const tag = document.getElementById('privateUserTag');
  if (tag) tag.innerHTML = name + ' - Espacio Privado';
  
  const bgLayer = document.getElementById('bgLayer');
  const indicator = document.getElementById('bgIndicator');
  if (bgLayer) bgLayer.className = 'bg-layer ' + (user === 'A' ? 'raul' : 'marta');
  if (indicator) {
    indicator.className = 'bg-indicator ' + (user === 'A' ? 'raul' : 'marta') + ' visible';
    indicator.textContent = (user === 'A' ? '🌱 Modo Raul' : '🐨 Modo Marta');
    setTimeout(() => { indicator.classList.remove('visible'); }, 3000);
  }
  
  const nav = document.querySelector('.bottom-nav');
  if (nav) {
    const btn = document.createElement('button');
    btn.className = 'nav-item';
    btn.onclick = (e) => switchTab(e, 'privado');
    btn.innerHTML = '<span class="icon">🔒</span><span>Mi Espacio</span>';
    nav.appendChild(btn);
  }
}

loadLocal();
initFirebase();
renderAll();
if (privateSession.authenticated) renderPrivateSpace(true);
</script>
